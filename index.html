<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دعوة ليان وأحمد</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #eee5dc;
    }

    body {
      width: 100%;
      min-height: 100vh;
    }

    .invitation {
      position: relative;
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
    }

    .invitation img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* منطقة الضغط على زر موقع الحفل */
    .map-link {
      position: absolute;
      left: 29.5%;
      top: 70.7%;
      width: 47%;
      height: 6.5%;

      display: block;
      background: transparent;
      border: none;
      border-radius: 60px;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .map-link:active {
      background: rgba(255,255,255,0.08);
    }
  </style>
</head>

<body>

  <div class="invitation">

    <img
      src="invitation.PNG"
      alt="دعوة ليان وأحمد"
    >

    <a
      class="map-link"
      href="https://www.google.com/maps/search/?api=1&query=قاعة+ليلاك+عمان+دابوق"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="موقع الحفل على الخريطة">
    </a>

  </div>

</body>

</html>
